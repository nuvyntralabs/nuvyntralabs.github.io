name: Save vlog draft

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  draft:
    if: contains(github.event.issue.body, 'nuvyntra-vlog-draft')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Save unpublished DEV draft
        run: node ./scripts/save-vlog-issue.mjs
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
