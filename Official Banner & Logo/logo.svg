<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGlowIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Node Color Gradients -->
    <linearGradient id="gradCyanIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="gradPurpleIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="gradEmeraldIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="120" height="120" rx="28" fill="url(#bgGlowIcon)"/>

  <!-- Logo Mark (Centered Hexagon N Structure) -->
  <g transform="translate(10, 10)">
    <!-- Outer Hexagon Outline -->
    <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="none" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Left N Pillar -->
    <path d="M 25 35 L 25 75 L 37 68 L 37 42 Z" fill="url(#gradCyanIcon)"/>
    
    <!-- Diagonal Connection -->
    <path d="M 37 42 L 63 68 L 63 52 L 37 26 Z" fill="url(#gradPurpleIcon)"/>
    
    <!-- Right N Pillar -->
    <path d="M 63 25 L 63 65 L 75 58 L 75 32 Z" fill="url(#gradEmeraldIcon)"/>

    <!-- Orbital Infrastructure Nodes -->
    <circle cx="50" cy="5" r="4" fill="#38BDF8"/>
    <circle cx="90" cy="27.5" r="4" fill="#818CF8"/>
    <circle cx="90" cy="72.5" r="4" fill="#34D399"/>
    <circle cx="50" cy="95" r="4" fill="#38BDF8"/>
    <circle cx="10" cy="72.5" r="4" fill="#818CF8"/>
    <circle cx="10" cy="27.5" r="4" fill="#34D399"/>
  </g>
</svg>
